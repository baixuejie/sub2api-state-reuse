# Include inside the SAME server{} as the Sub2API administrator UI.
# Keep existing app/API routes. Change 17843 if STATE_MONITOR_PORT differs.
location = /admin/state-harvest {
    proxy_pass http://127.0.0.1:17843;
    proxy_set_header Host $host;
}
location ^~ /fn-state/ {
    proxy_pass http://127.0.0.1:17843;
    proxy_set_header Host $host;
}
